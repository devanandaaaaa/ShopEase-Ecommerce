
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f5fb">

    <title>Product Details | ShopEase</title>
    <link rel="stylesheet" href="Style.css">

<style>
    /* ShopEase — Premium Product Details */

    :root {
        --primary: #5145e5;
        --primary-dark: #4035ca;
        --ink: #202939;
        --muted: #748096;
        --surface: #ffffff;
        --page: #f4f5fb;
        --border: #e2e6ef;
        --success: #149b5a;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        color: var(--ink);
        background:
            radial-gradient(
                circle at 8% 20%,
                rgba(124, 105, 255, 0.10),
                transparent 28%
            ),
            var(--page);
        font-family: Inter, -apple-system, BlinkMacSystemFont,
            "Segoe UI", Arial, sans-serif;
    }

    /* Navigation */

    header {
        position: sticky;
        top: 0;
        z-index: 20;
        min-height: 78px;
        padding: 18px 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
        background: rgba(255, 255, 255, 0.94);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(16px);
        box-shadow: 0 4px 20px rgba(32, 41, 57, 0.035);
    }

    .logo {
        color: var(--ink);
        font-size: 29px;
        font-weight: 850;
        letter-spacing: -1.4px;
    }

    nav {
        display: flex;
        align-items: center;
        gap: 32px;
    }

    nav a {
        color: #59657a;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    nav a:hover {
        color: var(--primary);
    }

    /* Main product card */

    .product-details {
        width: 90%;
        max-width: 1440px;
        margin: 48px auto 64px;
        padding: clamp(22px, 3.5vw, 52px);
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
        align-items: center;
        gap: clamp(28px, 4vw, 64px);
        background: var(--surface);
        border: 1px solid rgba(226, 230, 239, 0.95);
        border-radius: 28px;
        box-shadow: 0 24px 70px rgba(32, 41, 57, 0.075);
        animation: reveal 0.5s ease both;
    }

    @keyframes reveal {
        from {
            opacity: 0;
            transform: translateY(12px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Product image */

    .details-image {
        width: 100%;
        height: clamp(350px, 43vw, 570px);
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: linear-gradient(145deg, #f4f3ff, #f5f7fb 65%, #eeefff);
        border: 1px solid #e7e5fb;
        border-radius: 24px;
    }

    .details-image img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 16px;
        mix-blend-mode: multiply;
        transition: transform 0.45s ease;
    }

    .details-image:hover img {
        transform: scale(1.045);
    }

    /* Product information */

    .details-info {
        min-width: 0;
        padding: 10px 0;
    }

    .details-info .category {
        display: inline-block;
        width: fit-content;
        margin: 0 0 18px;
        padding: 8px 13px;
        color: var(--primary);
        background: #f0edff;
        border: 1px solid #e7e2ff;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .details-info h1 {
        margin: 0 0 16px;
        color: var(--ink);
        font-size: clamp(30px, 3.2vw, 46px);
        font-weight: 850;
        line-height: 1.13;
        letter-spacing: -1.7px;
    }

    .details-price {
        margin: 0 0 20px;
        color: var(--primary);
        font-size: clamp(28px, 3vw, 36px);
        font-weight: 850;
        letter-spacing: -1px;
    }

    .description {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.8;
    }

    .rating {
        margin: 0 0 12px;
        color: #59657a;
        font-size: 15px;
    }

    .stock {
        margin: 0 0 24px;
        font-size: 14px;
        font-weight: 800;
    }

    .product-features {
        margin: 0 0 26px;
        padding: 18px 20px;
        background: #fafaff;
        border: 1px solid #efedff;
        border-radius: 16px;
        line-height: 2.1;
    }

    .product-features p {
        margin: 0;
        color: #465167;
        font-size: 14px;
        font-weight: 600;
    }

    /* Quantity selector */

    .quantity {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 0 0 22px;
    }

    .quantity button {
        width: 46px;
        height: 46px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 13px;
        background: #f1f2fb;
        color: var(--ink);
        font-size: 22px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .quantity button:hover {
        color: white;
        background: var(--primary);
        border-color: var(--primary);
        transform: translateY(-2px);
    }

    #quantity {
        min-width: 22px;
        color: var(--ink);
        font-size: 20px;
        font-weight: 800;
        text-align: center;
    }

    /* Add to Cart */

    .add-cart-btn {
        width: 100%;
        max-width: none;
        min-height: 58px;
        padding: 16px 22px;
        border: 0;
        border-radius: 15px;
        background: linear-gradient(110deg, #5145e5, #7358f5);
        box-shadow: 0 10px 24px rgba(81, 69, 229, 0.22);
        color: white;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .add-cart-btn:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 15px 30px rgba(81, 69, 229, 0.3);
        background: linear-gradient(110deg, #4035ca, #6248e9);
    }

    .add-cart-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        box-shadow: none;
    }

    /* Loading and error messages */

    .details-message {
        width: 90%;
        max-width: 900px;
        margin: 60px auto;
        padding: 48px 28px;
        color: var(--muted);
        background: white;
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(32, 41, 57, 0.06);
        text-align: center;
    }

    .details-message h2 {
        margin: 0 0 12px;
        color: var(--ink);
    }

    .details-message a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 18px;
        color: white;
        background: var(--primary);
        border-radius: 11px;
        font-weight: 700;
        text-decoration: none;
    }

    .details-message a:hover {
        background: var(--primary-dark);
    }

    /* Responsive */

    @media (max-width: 850px) {
        header {
            padding: 16px 5%;
        }

        nav {
            gap: 18px;
        }

        .product-details {
            grid-template-columns: 1fr;
            width: 90%;
            margin: 30px auto 45px;
            gap: 30px;
        }

        .details-image {
            height: clamp(300px, 65vw, 480px);
        }

        .details-info h1 {
            font-size: clamp(30px, 5vw, 40px);
        }
    }

    @media (max-width: 560px) {
        header {
            align-items: flex-start;
            flex-direction: column;
            gap: 14px;
        }

        .logo {
            font-size: 25px;
        }

        nav {
            width: 100%;
            justify-content: space-between;
            gap: 10px;
        }

        nav a {
            font-size: 13px;
        }

        .product-details {
            width: 92%;
            padding: 17px;
            margin: 22px auto 36px;
            gap: 22px;
            border-radius: 21px;
        }

        .details-image {
            height: 290px;
            padding: 12px;
            border-radius: 17px;
        }

        .details-info h1 {
            font-size: 30px;
            letter-spacing: -1px;
        }

        .details-price {
            font-size: 28px;
        }

        .product-features {
            padding: 14px;
        }

        .add-cart-btn {
            min-height: 54px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.01ms !important;
        }
    }

    /* Final product page refinements */
.product-details {
    margin-top: 36px;
}

.details-image {
    padding: 12px;
}

.details-image img {
    object-fit: contain;
    max-height: 100%;
    max-width: 100%;
}

@media (max-width: 850px) {
    .product-details {
        margin-top: 26px;
    }
}
</style>
</head>

<body>
    <header>
        <a class="logo" href="index.html"
           style="text-decoration:none;">ShopEase</a>
           <nav>
             <a href="index.html">Home</a>
             <a href="#productContainer">Products</a>
             <a href="http://localhost:5173/login">Login</a>
             <a href="http://localhost:5173/register">Register</a>
             <a href="http://localhost:5173/profile">Profile</a>
             <a href="http://localhost:5173/orders">Orders</a>
             <a href="http://localhost:5173/cart">Cart 🛒</a>
           </nav>
    </header>

    <main id="mainContent">
        <div class="details-message">
            <h2>Loading product...</h2>
            <p>Please wait while we fetch the product details.</p>
        </div>
    </main>

    <script>
        const API_URL = "http://localhost:5001/api";
        const productId = new URLSearchParams(
            window.location.search
        ).get("id");

        let product = null;
        let quantity = 1;

        const mainContent = document.getElementById("mainContent");

        function showMessage(title, message) {
            mainContent.innerHTML = `
                <section class="details-message">
                    <h2>${title}</h2>
                    <p>${message}</p>
                    <a href="index.html">← Back to products</a>
                </section>
            `;
        }

        async function loadProduct() {
            if (!productId) {
                showMessage(
                    "Product not found",
                    "No product ID was provided. Please choose a product from the storefront."
                );
                return;
            }

            try {
                const response = await fetch(`${API_URL}/products`);

                if (!response.ok) {
                    throw new Error("Could not load products from the server.");
                }

                const result = await response.json();
                const products = Array.isArray(result)
                    ? result
                    : result.products;

                if (!Array.isArray(products)) {
                    throw new Error("The server returned an unexpected product list.");
                }

                product = products.find(item =>
                    String(item.id || item._id) === String(productId)
                );

                if (!product) {
                    showMessage(
                        "Product not found",
                        "This product may no longer be available. Please return to the storefront."
                    );
                    return;
                }

                renderProduct();
            } catch (error) {
                console.error("Product loading error:", error);

                showMessage(
                    "Unable to load product",
                    "Please check that the backend is running and try refreshing this page."
                );
            }
        }

        function renderProduct() {
            const inStock = Boolean(product.stock ?? product.available);

            mainContent.innerHTML = `
                <section class="product-details">
                    <div class="details-image">
                        <img
                            id="productImage"
                            src="${product.image || ""}"
                            alt="${escapeHTML(product.name)}"
                        >
                    </div>

                    <div class="details-info">
                        <p class="category">
                            ${escapeHTML(product.category || "General")}
                        </p>

                        <h1>${escapeHTML(product.name)}</h1>

                        <p class="details-price">
                            ₹${Number(product.price).toLocaleString("en-IN")}
                        </p>

                        <p class="description">
                            Discover ${escapeHTML(product.name)}.
                            A great choice for your everyday needs.
                        </p>

                        <p class="rating">
                            ⭐ ${Number(product.rating || 0)} / 5
                        </p>

                        <p class="stock"
                           style="color:${inStock ? "#149b5a" : "#dc2626"}">
                            ${inStock ? "In stock" : "Out of stock"}
                        </p>

                        <div class="product-features">
                            <p>✓ Quality Product</p>
                            <p>✓ Comfortable Design</p>
                            <p>✓ Best Value</p>
                            <p>✓ Suitable for Daily Use</p>
                        </div>

                        <div class="quantity">
                            <button type="button"
                                    onclick="decreaseQuantity()"
                                    aria-label="Decrease quantity">−</button>

                            <span id="quantity" aria-live="polite">1</span>

                            <button type="button"
                                    onclick="increaseQuantity()"
                                    aria-label="Increase quantity">+</button>
                        </div>

                        <button
                            id="addCartButton"
                            class="add-cart-btn"
                            type="button"
                            onclick="addToCart()"
                            ${inStock ? "" : "disabled"}
                        >
                            ${inStock ? "Add to Cart 🛒" : "Out of Stock"}
                        </button>
                    </div>
                </section>
            `;

            const image = document.getElementById("productImage");
            image.addEventListener("error", () => {
                image.alt = "Product image unavailable";
                image.style.visibility = "hidden";
            }, { once: true });
        }

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }

        function increaseQuantity() {
            if (!product) return;

            quantity++;
            document.getElementById("quantity").textContent = quantity;
        }

        function decreaseQuantity() {
            if (quantity > 1) {
                quantity--;
                document.getElementById("quantity").textContent = quantity;
            }
        }

        async function addToCart() {
            if (!product) return;

            const button = document.getElementById("addCartButton");
            button.disabled = true;
            button.textContent = "Adding...";

            try {
                const response = await fetch(`${API_URL}/cart`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({
                        productId: String(product.id || product._id),
                        name: product.name,
                        category: product.category,
                        price: Number(product.price),
                        image: product.image,
                        quantity: quantity
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        throw new Error("Please log in before adding products to your cart.");
                    }

                    throw new Error(
                        data.message || "Could not add this product to your cart."
                    );
                }

                alert(
                    `${product.name} added to your cart!\n` +
                    `Quantity: ${quantity}\n` +
                    `Total: ₹${(Number(product.price) * quantity).toLocaleString("en-IN")}`
                );

                button.textContent = "Added to Cart ✓";
            } catch (error) {
                console.error("Add to cart error:", error);
                alert(error.message || "Could not connect to the server.");
            } finally {
                button.disabled = !Boolean(product.stock ?? product.available);
                if (!button.textContent.includes("Added to Cart")) {
                    button.textContent = "Add to Cart 🛒";
                }
            }
        }

        loadProduct();
    </script>
</body>
